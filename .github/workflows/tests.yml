name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Run the test suite
        run: >
          python -m pytest -q
          --cov=api --cov=core --cov=llm --cov=scrapers
          --cov=discovery --cov=cli
          --cov-report=term --cov-fail-under=85
        env:
          PYTHONIOENCODING: utf-8
      - name: Byte-compile every module
        run: python -m compileall -q api core discovery eval llm scrapers tools frontend cli.py
      - name: Audit dependencies (non-blocking)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

  browser:
    name: browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run the browser smoke tests
        run: python -m pytest -q -rs tests/test_frontend_browser.py
        env:
          PYTHONIOENCODING: utf-8
